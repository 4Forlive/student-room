            text-align: center;
            width: 100%;
            max-width: 400px;

            margin-bottom: 20px;
        }

            width: 80%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        #result {

            font-size: 18px;
            color: #333;

            background-color: #f9f9f9;
            border-radius: 8px;
            border: 1px dashed #ccc;
            display: none; /* ซ่อนไว้ก่อนจนกว่าจะค้นหา */
        }
        .student-name {
            color: #0056b3;
            font-size: 20px;
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
        .room-number {

    function checkRoom() {
        const id = document.getElementById("studentId").value.trim();
        const resultDiv = document.getElementById("result");
        
        // แสดงกรอบผลลัพธ์
        resultDiv.style.display = "block";

        if (id === "") {
            resultDiv.innerHTML = "<span style='color: red;'>กรุณากรอกเลขประจำตัวนักเรียน</span>";
            return;
        }

        // ค้นหาข้อมูลใน object studentData (ดึงมาทั้งก้อน)
        const studentInfo = studentData[id];

        if (studentInfo) {
            // ถ้าเจอข้อมูล ให้แสดงผลทั้งชื่อและห้อง
            resultDiv.innerHTML = `
                <span style="font-size: 14px; color: #666;">รหัสนักเรียน: ${id}</span>
                <span class="student-name">${studentInfo.name}</span>
                <span style="font-size: 16px; color: #333;">ห้องพัก</span>
                <span class="room-number">${studentInfo.room}</span>
            `;
        } else {
            // ถ้าไม่เจอข้อมูล
            resultDiv.innerHTML = `<span style='color: red;'>ไม่พบข้อมูลของเลขประจำตัว <b>${id}</b></span>`;
        }
    }

    // กด Enter เพื่อค้นหา
    function handleKeyPress(event) {
        if (event.key === "Enter") {
            checkRoom();
        }
    }
