<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบค้นหาห้องพักนักเรียนค่าย GEP</title>
    <style>
        body {
            font-family: 'Sarabun', Tahoma, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 80%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
            color: #333;
            min-height: 80px; /* เพิ่มความสูงเผื่อแสดงชื่อและห้อง */
            padding: 15px;
            background-color: #f9f9f9;
            border-radius: 8px;
            border: 1px dashed #ccc;
            display: none; /* ซ่อนไว้ก่อนจนกว่าจะค้นหา */
        }
        .student-name {
            color: #0056b3;
            font-size: 20px;
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
        .room-number {
            color: #d9534f;
            font-size: 24px;
            font-weight: bold;
            display: block;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>ตรวจสอบห้องพักค่าย GEP</h2>
    <input type="text" id="studentId" placeholder="กรอกเลขประจำตัวนักเรียน..." onkeypress="handleKeyPress(event)">
    <br>
    <button onclick="checkRoom()">ค้นหา</button>
    
    <!-- พื้นที่สำหรับแสดงผลลัพธ์ -->
    <div id="result"></div>
</div>

<script>
    // ฐานข้อมูลจำลองแบบใหม่ (เก็บทั้งชื่อและห้อง)
    const studentData = {
        "1001": { name: "ด.ช. สมชาย รักเรียน", room: "ห้อง 101 (ตึก A)" },
        "1002": { name: "ด.ญ. สมหญิง จริงใจ", room: "ห้อง 102 (ตึก A)" },
        "1003": { name: "นาย มานะ พากเพียร", room: "ห้อง 201 (ตึก B)" },
        "1004": { name: "นางสาว มาลี สีสวย", room: "ห้อง 205 (ตึก B)" },
        "5555": { name: "ผอ. ยอดเยี่ยม เสมอมา", room: "ห้อง VIP (ตึก C)" }
    };

    function checkRoom() {
        const id = document.getElementById("studentId").value.trim();
        const resultDiv = document.getElementById("result");
        
        // แสดงกรอบผลลัพธ์
        resultDiv.style.display = "block";

        if (id === "") {
            resultDiv.innerHTML = "<span style='color: red;'>กรุณากรอกเลขประจำตัวนักเรียน</span>";
            return;
        }

        // ค้นหาข้อมูลใน object studentData (ดึงมาทั้งก้อน)
        const studentInfo = studentData[id];

        if (studentInfo) {
            // ถ้าเจอข้อมูล ให้แสดงผลทั้งชื่อและห้อง
            resultDiv.innerHTML = `
                <span style="font-size: 14px; color: #666;">รหัสนักเรียน: ${id}</span>
                <span class="student-name">${studentInfo.name}</span>
                <span style="font-size: 16px; color: #333;">ห้องพัก</span>
                <span class="room-number">${studentInfo.room}</span>
            `;
        } else {
            // ถ้าไม่เจอข้อมูล
            resultDiv.innerHTML = `<span style='color: red;'>ไม่พบข้อมูลของเลขประจำตัว <b>${id}</b></span>`;
        }
    }

    // กด Enter เพื่อค้นหา
    function handleKeyPress(event) {
        if (event.key === "Enter") {
            checkRoom();
        }
    }
</script>

</body>
</html>
